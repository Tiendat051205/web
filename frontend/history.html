<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Lịch sử CV - CV Maker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="history">
  <header class="top-header">
    <div class="brand-block">
      <div class="brand-badge">CV</div>
      <div>
        <h1>Lịch sử CV</h1>
        <p>Xem lại các CV đã lưu và mở lại để chỉnh sửa</p>
      </div>
    </div>

    <div class="auth-area">
      <div class="auth-actions" data-logged-out>
        <a class="btn btn-outline" href="login.html">Đăng nhập</a>
        <a class="btn btn-primary" href="register.html">Đăng ký</a>
      </div>

      <div class="user-panel" data-logged-in hidden>
        <span class="welcome-text">Xin chào, <strong data-user-name>Người dùng</strong></span>
        <button class="btn btn-outline" type="button" data-logout-btn>Đăng xuất</button>
      </div>
    </div>
  </header>

  <nav class="main-nav">
    <a href="home.html" class="nav-link">Trang chủ</a>
    <a href="CV1.html" class="nav-link" data-protected-link="CV1.html">CV1</a>
    <a href="CV2.html" class="nav-link" data-protected-link="CV2.html">CV2</a>
    <a href="history.html" class="nav-link active">Lịch sử CV</a>
  </nav>

  <main class="page-wrap">
    <section class="section-head">
      <h3>Danh sách CV đã lưu</h3>
      <p>Chỉ hiển thị các CV của tài khoản đang đăng nhập.</p>
    </section>

    <section class="history-layout">
      <div class="history-list" data-history-list>
        <div class="empty-state">Đang tải...</div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
