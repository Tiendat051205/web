<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>JobGenius - Đăng Ký</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="logo">
        <a href="home.html">
            <i class="fas fa-file-alt"></i> JobGenius
        </a>
    </div>

    <div class="page-shell">
        <nav class="top-nav">
            <a href="home.html"><i class="fas fa-home"></i> Trang chủ</a>
        </nav>
        
        <div class="register-container">
            <h2>Sign up</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <!-- Đã sửa type thành text -->
                    <input type="text" id="fullName" placeholder="Enter your name">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <!-- Đã sửa type thành email -->
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <!-- Đã sửa type thành password -->
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                
                <div class="register-success" id="registerSuccess" style="display:none; background:#d4edda; color:#155724; padding:12px 16px; border-radius:8px; margin-bottom:16px; text-align:center; font-weight:500;">
                    <i class="fas fa-check-circle"></i> Đăng ký thành công
                </div>
                
                <button type="submit" class="register">Register</button>
            </form>

            <div class="login-link">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
