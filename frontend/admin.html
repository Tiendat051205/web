<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị - JobGenius</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="header">
    <div class="logo"><a href="home.html"><i class="fas fa-file-alt"></i> JobGenius Admin</a></div>
    <nav class="nav-menu site-nav">
      <a href="home.html" class="site-nav__link"><i class="fas fa-home"></i> Trang chủ</a>
      <a href="history.html" class="site-nav__link"><i class="fas fa-history"></i> Lịch sử CV</a>
      <a href="about.html" class="site-nav__link"><i class="fas fa-info-circle"></i> Giới thiệu</a>
      <a href="admin.html" id="adminLink" class="active" style="display: none;">🔧 Quản trị</a>
    </nav>
    <div class="auth-section" id="authSection"></div>
  </header>

  <div class="admin-container">
    <div class="admin-header">
      <h1><i class="fas fa-cog"></i> Bảng điều khiển</h1>
      <span style="color:#666;">Chào mừng Admin!</span>
    </div>

    <div class="quick-actions">
      <a href="home.html" class="action-btn action-btn-primary"><i class="fas fa-plus-circle"></i> Tạo CV mới</a>
      <a href="history.html" class="action-btn"><i class="fas fa-history"></i> Xem lịch sử CV</a>
      <a href="home.html" class="action-btn"><i class="fas fa-layer-group"></i> Chọn mẫu CV</a>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><i class="fas fa-users"></i><div class="number" id="totalUsers">0</div><div class="label">Người dùng</div></div>
      <div class="stat-card"><i class="fas fa-file-alt"></i><div class="number" id="totalCVs">0</div><div class="label">CV đã tạo</div></div>
      <div class="stat-card"><i class="fas fa-comments"></i><div class="number" id="totalComments">0</div><div class="label">Bình luận</div></div>
      <div class="stat-card"><i class="fas fa-eye"></i><div class="number" id="totalViews">0</div><div class="label">Lượt xem</div></div>
    </div>

    <!-- Templates -->
    <div class="admin-section">
      <h2><i class="fas fa-edit"></i> Quản lý mẫu CV</h2>
      <div id="templateList"></div>
    </div>

    <!-- Comments -->
    <div class="admin-section">
      <h2><i class="fas fa-comments"></i> Quản lý bình luận</h2>
      <div id="commentsList"></div>
    </div>

    <!-- Contacts -->
    <div class="admin-section">
      <h2><i class="fas fa-envelope"></i> Quản lý liên hệ</h2>
      <div id="contactsList"></div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
